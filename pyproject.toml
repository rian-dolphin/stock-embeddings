[project]
name = "stock-embeddings"
version = "0.1.0"
description = "Learning distributed representations (embeddings) for financial assets from returns time series"
authors = [
    { name = "rian-dolphin", email = "rdolphin98@gmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "imbalanced-learn>=0.14.2",
    "numpy>=2.0",
    "plotly>=6.9.0",
    "polars>=1.42.1",
    "scikit-learn>=1.3",
    "scipy>=1.18.0",
    "torch>=2.13.0",
    "tqdm>=4.68.4",
]

[project.optional-dependencies]
ucr = [
    "dtaidistance>=2.4.0",
    "numba>=0.66.0",
    "sktime>=1.0",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "nbconvert>=7.17.1",
    "nbformat>=5.10.4",
    "pytest>=9.1.1",
]
